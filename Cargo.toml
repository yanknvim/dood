[package]
name = "dood"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["image-data", "wayland-data-control"] }
eframe = "=0.37.0"
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[dev-dependencies]
egui_kittest = { version = "=0.37.0", features = ["wgpu"] }
egui_system_font_provider = "=0.37.0"
